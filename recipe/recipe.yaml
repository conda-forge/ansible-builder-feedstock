schema_version: 1

context:
  version: "3.2.0"

package:
  name: ansible-builder
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/a/ansible-builder/ansible_builder-${{ version }}.tar.gz
  sha256: 8cd8639011127aaa5046fd60e56ae753eb599061bf493eca2c6b75c54cfc6212

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - ansible-builder = ansible_builder.cli:run

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0.3,<=84.0.0
    - setuptools-scm >=6.2,<=10.3.4
    - pip
  run:
    - python >=${{ python_min }}
    - bindep
    - jsonschema
    - packaging
    - pyyaml

tests:
  - python:
      imports:
        - ansible_builder
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - requirements:
      run:
        - pip
        - python
    script:
      - ansible-builder --help

about:
  summary: A tool for building Ansible Execution Environments
  homepage: https://ansible-builder.readthedocs.io
  repository: https://ansible-builder.readthedocs.io
  license: Apache-2.0
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - killua156
    - mgorny
